services:

  openchat-ollama-service:
    image: ollama/ollama:latest@sha256:4a559b2dd3ef125d83f0b65f3f48d4795569c47d9ddbc3de36b3c1532da194d8
    pull_policy: always
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - app_network

  openchat-encryption-service:
    image: opengpunetwork/openchat-encryption:latest
    pull_policy: always
    ports:
      - "5556:5555"
    environment:
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  openchat-t2t-service:
    image: opengpunetwork/openchat-text2text:latest@sha256:daf5714a1f8f2b9031d9ed62ffb4cd3763e5ff2bf1063cb58f7b5d90362e4c5e
    pull_policy: always
    ports:
      - "${PORT}:5555"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CALLBACK_URL=${CALLBACK_URL}
      - OLLAMA_HOST=http://openchat-ollama-service:11434
      - ENCRYPTION_SERVICE_URL=http://openchat-encryption-service:5555
    depends_on:
      - openchat-ollama-service
      - openchat-encryption-service
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  ollama_models:
    driver: local